# Project command contract, read by scripts/commands.sh from .awf/commands.yaml in the main worktree.
# Each line replaces one operation with `operation: command`; the operation's arguments are appended to the command.
# A ` #` starts a comment. An operation left out keeps the pack's default, built on git (see scripts/commands.sh).
#
# The git defaults suit a project without a stack driver; run-tasks needs flock(1).
#
# A project driven by a stack script declares the whole worktree family, so that settings and merges all go
# through the same tool:
create: bin/stack worktree create
deps: bin/stack worktree deps
mounted: bin/stack worktree mounted
settings: bin/stack worktree settings
merge: bin/stack worktree merge
run-tasks: bin/stack worktree run-tasks

# In a Susan run, the questions of a workflow (the EGM decision of flow-review) go to the dashboard instead of the
# terminal. The declared command receives --run <id> --kind <kind> --question <text> --options <a,b,...>
# --recommended <option> --resume-step <step> --input <name>, and must not block. The answer comes back as
# `awf resume <id> --from <step> --input <name>=<answer>`: the input keeps the name given by --input (egm_decision).
# ask: bin/susan-ask
