name: tdd-slice-rust
version: "1.0.0"
description: >-
  One TDD slice in Rust: RED, GREEN, then the `review` workflow. The RED level (unit, functional, integration) is the
  one of the language key that names the slice in tasks.md, for instance `[rust-unit]` or `[rust-integration]`: each key
  of .awf/languages.yaml has its own `red` command and `tests` patterns. A review failure is routed by
  `tdd-gate.sh classify`: a missed mutant goes back to RED (a test that kills it), any other failure to GREEN, and the
  third turn without progress stops the slice. Moving from one phase to the next depends on the tools, never on what
  the agent declares. The status is written to .awf/status/tdd-slice.json.

inputs:
  - name: change
    type: string
    required: true
  - name: slice
    type: string
    required: true
  - name: hexagon
    type: string
    default: rust
    description: Key of the language registry (.awf/languages.yaml).
  - name: tests
    type: string
    default: ""
    description: >-
      Test files of the slice, separated by spaces. Without a value, the RED gate takes the new or changed test files
      that git sees for the language.
  - name: agent
    type: string
    default: claude
  - name: critical
    type: string
    default: "false"
    description: '"true" when the slice carries [critical]: critical_steps and required join the review.'
  - name: base
    type: string
    default: ""
    description: Commit at the start of the slice; mutation only covers the files changed since then.

states:
  initial: red

  red:
    type: agent
    skills:
      - path: ../skills/tdd-rust
    provider: "{{.inputs.agent}}"
    prompt_file: "{{.awf.prompts_dir}}/tdd-rust-red.md"
    options:
      allowed_tools: "Read,Grep,Glob,Edit,Write,Bash"
    timeout: 1200
    on_success: check_red
    on_failure: agent_failed

  check_red:
    type: step
    command: bash {{.awf.scripts_dir}}/tdd-gate.sh red {{.inputs.hexagon}} {{.inputs.tests}}
    on_success: check_trace
    on_failure: {message: "RED: {{.states.check_red.Output}}", status: 10}

  # A critical slice links each critical scenario of the change to a test (`// scenario: <exact title>`) in RED.
  check_trace:
    type: step
    command: |
      [ '{{.inputs.critical}}' = true ] || exit 0
      bash {{.awf.scripts_dir}}/critical-trace.sh {{.inputs.change}} {{.inputs.hexagon}}
    on_success: init_turns
    on_failure: {message: "RED (trace): {{.states.check_trace.Output}}", status: 11}

  # The counter of GREEN fix turns starts from zero at each slice.
  init_turns:
    type: step
    command: bash {{.awf.scripts_dir}}/tdd-gate.sh green-turn reset
    on_success: green
    on_failure: stop

  green:
    type: agent
    skills:
      - path: ../skills/green-implementer
      - path: ../skills/tdd-rust
    provider: "{{.inputs.agent}}"
    prompt_file: "{{.awf.prompts_dir}}/tdd-rust-green.md"
    options:
      allowed_tools: "Read,Grep,Glob,Edit,Write,Bash"
    timeout: 3600
    on_success: check_green
    on_failure: agent_failed

  check_green:
    type: step
    command: bash {{.awf.scripts_dir}}/tdd-gate.sh green {{.inputs.hexagon}}
    continue_on_error: true
    transitions:
      - when: 'states.check_green.ExitCode == 0'
        goto: review
      - goto: green_turn

  # Three turns at most: the fourth `count` exits with 1 and stops the slice.
  green_turn:
    type: step
    command: bash {{.awf.scripts_dir}}/tdd-gate.sh green-turn count
    on_success: fix
    on_failure: green_failed

  green_failed:
    type: step
    command: "false"
    on_failure: {message: "GREEN: three turns without progress. {{.states.check_green.Output}}", status: 20}

  review:
    type: call_workflow
    workflow: review
    inputs:
      language: "{{.inputs.hexagon}}"
      base: "{{.inputs.base}}"
      change: "{{.inputs.change}}"
      critical: "{{.inputs.critical}}"
    timeout: 28800
    on_success: done
    on_failure: classify

  # The first word of the message in tdd-slice.json is the tool that the review saw failing.
  classify:
    type: step
    command: |
      tool=$(jq -r '.message | split(" ")[0]' .awf/status/tdd-slice.json)
      bash {{.awf.scripts_dir}}/tdd-gate.sh classify "$tool"
    transitions:
      - when: 'states.classify.Output contains "red"'
        goto: mutants
      - when: 'states.classify.Output contains "green"'
        goto: fix
      - goto: stop
    on_failure: stop

  mutants:
    type: agent
    skills:
      - path: ../skills/tdd-rust
    provider: "{{.inputs.agent}}"
    prompt_file: "{{.awf.prompts_dir}}/tdd-rust-mutants.md"
    options:
      allowed_tools: "Read,Grep,Glob,Edit,Write,Bash"
    timeout: 1200
    on_success: check_mutants
    on_failure: agent_failed

  check_mutants:
    type: step
    command: bash {{.awf.scripts_dir}}/tdd-gate.sh red-mutants {{.inputs.hexagon}} {{.inputs.tests}}
    on_success: review
    on_failure: {message: "RED (mutants): {{.states.check_mutants.Output}}", status: 13}

  fix:
    type: agent
    skills:
      - path: ../skills/green-implementer
      - path: ../skills/tdd-rust
    provider: "{{.inputs.agent}}"
    prompt_file: "{{.awf.prompts_dir}}/tdd-rust-fix.md"
    options:
      allowed_tools: "Read,Grep,Glob,Edit,Write,Bash"
    timeout: 3600
    on_success: check_green
    on_failure: agent_failed

  agent_failed:
    type: terminal
    status: failure

  stop:
    type: terminal
    status: failure

  done:
    type: terminal
    status: success
