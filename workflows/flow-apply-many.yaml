name: flow-apply-many
version: "1.2.0"
description: >-
  Applies several OpenSpec changes in parallel, each in its worktree, from main. For the given changes, in order:
  worktrees created (commands.sh create), applied by apply-change N at a time at most (commands.sh run-all), isolation
  checked (commands.sh verify), merged one by one into main (commands.sh merge, stopping at the first conflict), then
  end-to-end tests on main (commands.sh e2e, skipped when the project declares none). A failed change keeps its
  worktree and is not merged; the others go on. Report: .awf/status/apply-many.json.
  The end-to-end tests run only on main: the single running stack serves the code of main.

inputs:
  - name: changes
    type: string
    required: true
    description: Names of the changes, separated by spaces. The order is the merge order.
  - name: run_id
    type: string
    default: ""
    description: "Identifier of the run (optional). Empty, one is created (timestamp and random suffix). The report is in .awf/status/apply-many/<identifier>/apply-many.json."
  - name: max_changes
    type: string
    default: ""
    description: Changes applied at the same time. Empty, the value comes from commands.sh settings (environment FLOW_MAX_CHANGES, 2 by default).
  - name: max
    type: string
    default: ""
    description: Former name of max_changes, kept; max_changes wins.
  - name: max_tasks
    type: string
    default: ""
    description: Tasks applied at the same time in a (parallel) group of a change. Empty, 1 by default (sequential).
  - name: max_total
    type: string
    default: ""
    description: Cap, on the machine and across all changes, of the tasks of (parallel) groups in progress; sequential tasks do not count. Empty, 3 by default.

states:
  initial: init

  init:
    type: step
    command: RUN_ID='{{.inputs.run_id}}' WORKFLOW_ID='{{.workflow.ID}}' CHANGES='{{.inputs.changes}}' MAX='{{.inputs.max}}' MAX_CHANGES='{{.inputs.max_changes}}' MAX_TASKS='{{.inputs.max_tasks}}' MAX_TOTAL='{{.inputs.max_total}}' bash {{.awf.scripts_dir}}/apply-many.sh init
    on_success: create
    on_failure: {message: "INPUT: {{.states.init.Output}}", status: 2}

  create:
    type: step
    command: RUN_ID='{{.inputs.run_id}}' WORKFLOW_ID='{{.workflow.ID}}' CHANGES='{{.inputs.changes}}' bash {{.awf.scripts_dir}}/apply-many.sh create
    timeout: 1800
    continue_on_error: true
    on_success: run

  run:
    type: step
    command: RUN_ID='{{.inputs.run_id}}' WORKFLOW_ID='{{.workflow.ID}}' CHANGES='{{.inputs.changes}}' MAX='{{.inputs.max}}' MAX_CHANGES='{{.inputs.max_changes}}' MAX_TASKS='{{.inputs.max_tasks}}' MAX_TOTAL='{{.inputs.max_total}}' bash {{.awf.scripts_dir}}/apply-many.sh run
    timeout: 28800
    continue_on_error: true
    on_success: verify

  verify:
    type: step
    command: RUN_ID='{{.inputs.run_id}}' WORKFLOW_ID='{{.workflow.ID}}' CHANGES='{{.inputs.changes}}' bash {{.awf.scripts_dir}}/apply-many.sh verify
    continue_on_error: true
    on_success: merge

  merge:
    type: step
    command: RUN_ID='{{.inputs.run_id}}' WORKFLOW_ID='{{.workflow.ID}}' CHANGES='{{.inputs.changes}}' bash {{.awf.scripts_dir}}/apply-many.sh merge
    continue_on_error: true
    on_success: e2e

  # End-to-end tests run only on main, after the merges; the project's e2e command takes its own lock.
  e2e:
    type: step
    command: RUN_ID='{{.inputs.run_id}}' WORKFLOW_ID='{{.workflow.ID}}' CHANGES='{{.inputs.changes}}' bash {{.awf.scripts_dir}}/apply-many.sh e2e
    timeout: 3600
    continue_on_error: true
    on_success: report

  report:
    type: step
    command: RUN_ID='{{.inputs.run_id}}' WORKFLOW_ID='{{.workflow.ID}}' CHANGES='{{.inputs.changes}}' bash {{.awf.scripts_dir}}/apply-many.sh report
    on_success: done
    on_failure: failed

  failed:
    type: terminal
    status: failure

  done:
    type: terminal
    status: success
