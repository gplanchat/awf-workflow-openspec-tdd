name: flow-archive
version: "1.0.0"
description: >-
  Archives an OpenSpec change without an agent. The workflow runs at the root of the worktree
  .worktrees/propose-<change> (branch docs/propose-<change>). Started anywhere else, it creates the worktree, then
  exits with code 2 and says where to run it again. It stops (code 2) while a box of tasks.md is open, installs the
  dependencies the worktree lacks with commands.sh deps (code 30 on failure), replays the command of each criterion of
  the Definition of Done without reading the boxes (code 30 at the first failure), passes the flow-gate gates,
  archives with openspec archive --yes, checks that the change is under openspec/changes/archive/ and that the strict
  validation of the specs succeeds, commits through flow-commit, then purges old pass proofs; the exit code of that
  purge does not count. Exit codes: 2 input, 30 gates. Report: .awf/status/flow-archive.json.

inputs:
  - name: change
    type: string
    required: true
    description: Name of the change, in kebab-case.

states:
  initial: init

  init:
    type: step
    command: |
      mkdir -p .awf/status
      rm -f .awf/status/flow-archive.json .awf/status/flow-gate.failed .awf/status/flow-gate.log
      if [ "$(git branch --show-current)" = "docs/propose-{{.inputs.change}}" ]; then
        exit 0
      fi
      bash {{.awf.scripts_dir}}/flow.sh init archive {{.inputs.change}} || exit $?
      echo "The worktree .worktrees/propose-{{.inputs.change}} is ready. Run again: cd .worktrees/propose-{{.inputs.change}} && awf run flow-archive --input change={{.inputs.change}}" >&2
      exit 2
    on_success: open_boxes
    on_failure: report_input

  # An open task or criterion stops the archive before any replay.
  open_boxes:
    type: step
    command: bash {{.awf.scripts_dir}}/flow.sh gate open {{.inputs.change}}
    on_success: dependencies
    on_failure: report_input

  # A fresh worktree has none of the dependencies that the replayed criteria need (vendor/, node_modules/...): the
  # project's deps operation installs them.
  dependencies:
    type: step
    command: bash {{.awf.scripts_dir}}/commands.sh deps .
    on_success: replay
    on_failure: report_gate

  # Every command is replayed, checked boxes included: a checked box proves nothing.
  replay:
    type: step
    command: bash {{.awf.scripts_dir}}/flow.sh gate replay {{.inputs.change}}
    on_success: gate
    on_failure: report_gate

  gate:
    type: call_workflow
    timeout: 28800
    workflow: flow-gate
    inputs:
      command: archive
      change: "{{.inputs.change}}"
    on_success: archive
    on_failure: report_gate

  archive:
    type: step
    command: openspec archive {{.inputs.change}} --yes
    on_success: verify
    on_failure: report_gate

  verify:
    type: step
    command: bash {{.awf.scripts_dir}}/flow.sh gate archive {{.inputs.change}}
    on_success: commit
    on_failure: report_gate

  commit:
    type: call_workflow
    timeout: 28800
    workflow: flow-commit
    inputs:
      command: archive
      change: "{{.inputs.change}}"
    on_success: purge
    on_failure: report_gate

  # Purge of old pass proofs: its exit code does not count, the archive is already committed.
  purge:
    type: step
    command: bash {{.awf.scripts_dir}}/tdd-gate.sh proofs purge
    on_success: report
    on_failure: report

  report:
    type: step
    command: bash {{.awf.scripts_dir}}/flow.sh report archive {{.inputs.change}} done 0 success $(cat .awf/status/flow-gate.failed 2>/dev/null)
    on_success: done
    on_failure: failed

  report_input:
    type: step
    command: bash {{.awf.scripts_dir}}/flow.sh report archive {{.inputs.change}} input 0 failed
    on_success: failed
    on_failure: {message: "Invalid input, open boxes, or a worktree to open: see the output of the failed step.", status: 2}

  report_gate:
    type: step
    command: bash {{.awf.scripts_dir}}/flow.sh report archive {{.inputs.change}} gate 0 failed
    on_success: failed
    on_failure: {message: "A gate failed: report in .awf/status/flow-archive.json, raw output in .awf/status/flow-gate.log.", status: 30}

  failed:
    type: terminal
    status: failure

  done:
    type: terminal
    status: success
