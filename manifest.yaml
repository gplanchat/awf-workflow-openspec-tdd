# Manifest of the openspec-tdd workflow pack, read by `awf workflow install` and `awf workflow info openspec-tdd`.
# Workflows are listed by name, without the .yaml extension. Run one with `awf run openspec-tdd/<workflow>`.
name: openspec-tdd
version: "0.5.0"
description: >-
  Applies OpenSpec changes test first: each code slice of tasks.md goes through RED, GREEN and a review whose tools
  come from the project's language registry (.awf/languages.yaml), then the change is reviewed and checked against its
  Definition of Done; flow-apply-many also merges it into main. Drafting, sync, acceptance and archiving of changes are
  included.
author: "Grégory Planchat"
license: Apache-2.0
awf_version: ">=0.11.9"
workflows:
  - agent-worktree
  - apply-change
  - apply-task
  - dod-verify
  - flow-accept
  - flow-apply
  - flow-apply-many
  - flow-archive
  - flow-commit
  - flow-explore
  - flow-gate
  - flow-propose
  - flow-sync
  - flow-update
  - flow-waive
  - free-task
  - review
  - tdd-slice-go
  - tdd-slice-php
  - tdd-slice-rust-perf
  - tdd-slice-rust
  - tdd-slice-threejs
  - tdd-slice-ts
